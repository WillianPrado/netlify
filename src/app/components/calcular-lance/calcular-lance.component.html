<div class="container">
    <h2>Calculadora de Lance Fixo</h2>
    
    <input 
    type="text" 
    id="valorFinal" 
    [ngModel]="valorFinalFormatado" 
    (ngModelChange)="onValorFinalChange($event)" 
    placeholder="Digite desejado pelo cliente"
    />

    <div *ngIf="valorOriginal !== null" class="resultado">
    <p>O valor final seria: <strong>R$ {{ valorOriginal | number:'1.2-2' }}</strong></p>
    </div>
  </div>
